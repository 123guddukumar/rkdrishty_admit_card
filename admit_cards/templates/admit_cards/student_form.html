<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drishti Admit Card System - {{ action }} Student</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS for Premium Dark UI -->
  <style>
    :root {
      --bg-primary: #080f1e;
      --bg-secondary: #0f1a30;
      --bg-card: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-color: #f0c040;
      --accent-hover: #d4a017;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --shadow-premium: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 14px;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
    }

    .form-container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 32px;
      box-shadow: var(--shadow-premium);
    }

    .premium-input {
      background-color: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .premium-input:focus {
      background-color: rgba(255, 255, 255, 0.07);
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(240, 192, 64, 0.15);
      color: #fff;
      outline: none;
    }
    .premium-input::placeholder {
      color: var(--text-muted);
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .btn-premium {
      background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
      color: #080f1e;
      border: none;
      font-weight: 700;
      border-radius: 10px;
      padding: 12px 24px;
      transition: all 0.2s;
    }
    .btn-premium:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(240, 192, 64, 0.35);
      background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
      color: #080f1e;
    }

    .btn-premium-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      font-weight: 600;
      border-radius: 10px;
      padding: 12px 24px;
      transition: all 0.2s;
    }
    .btn-premium-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .preview-box {
      border: 2px dashed var(--border-color);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.01);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="glass-card">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h3 class="m-0 text-white">
          <i class="fa-solid {% if action == 'Add' %}fa-user-plus{% else %}fa-user-pen{% endif %} me-2 text-warning"></i>
          {{ action }} Student Details
        </h3>
        <a href="{% url 'dashboard' %}" class="btn btn-sm btn-premium-secondary">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
        </a>
      </div>

      {% if messages %}
        <div class="row mb-3">
          <div class="col-12">
            {% for message in messages %}
              <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ message }}
                <button type="button" class="btn-close" data-bs-alert="close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          </div>
        </div>
      {% endif %}

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">

          
          <!-- Student Name -->
          <div class="col-md-6">
            <label class="form-label">Student Name</label>
            <input type="text" name="name" value="{{ student.name|default:'' }}" class="form-control premium-input" placeholder="Full name of student" required>
          </div>

          <!-- Father Name -->
          <div class="col-md-6">
            <label class="form-label">Father's Name</label>
            <input type="text" name="father_name" value="{{ student.father_name|default:'' }}" class="form-control premium-input" placeholder="Father's name" required>
          </div>

          <!-- Mother Name -->
          <div class="col-md-6">
            <label class="form-label">Mother's Name</label>
            <input type="text" name="mother_name" value="{{ student.mother_name|default:'' }}" class="form-control premium-input" placeholder="Mother's name" required>
          </div>

          <!-- Class -->
          <div class="col-md-3">
            <label class="form-label">Class</label>
            <input type="text" name="student_class" value="{{ student.student_class|default:'' }}" class="form-control premium-input" placeholder="e.g. 10th, 12th" required>
          </div>

          <!-- Batch -->
          <div class="col-md-3">
            <label class="form-label">Batch</label>
            <input type="text" name="batch" value="{{ student.batch|default:'Batch 2026' }}" class="form-control premium-input" placeholder="e.g. Batch 2026" required>
          </div>

          <!-- Aadhaar Number -->
          <div class="col-md-6">
            <label class="form-label">Aadhaar Number</label>
            <input type="text" name="aadhaar_number" value="{{ student.aadhaar_number|default:'' }}" class="form-control premium-input" placeholder="XXXX XXXX XXXX" maxlength="14" oninput="formatAadhaar(this)" required>
          </div>

          <!-- Registration Number -->
          <div class="col-md-6">
            <label class="form-label">Registration Number</label>
            <input type="text" name="registration_number" value="{{ student.registration_number|default:'' }}" class="form-control premium-input" placeholder="Registration number" required>
          </div>

          <!-- Mobile Number -->
          <div class="col-md-6">
            <label class="form-label">Mobile Number</label>
            <input type="text" name="mobile_number" value="{{ student.mobile_number|default:'' }}" class="form-control premium-input" placeholder="10-digit number" maxlength="10" required>
          </div>

          <!-- DOB -->
          <div class="col-md-6">
            <label class="form-label">Date of Birth</label>
            <input type="date" name="dob" value="{{ student.dob|date:'Y-m-d'|default:'' }}" class="form-control premium-input" required>
          </div>

          <!-- Gender -->
          <div class="col-md-6">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select premium-input" required>
              <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
              <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
            </select>
          </div>

          <!-- Address -->
          <div class="col-12">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control premium-input" rows="3" placeholder="Full residential address" required>{{ student.address|default:'' }}</textarea>
          </div>

          <!-- Photo Upload -->
          <div class="col-md-6">
            <label class="form-label">Student Photo (45 x 55 mm)</label>
            <input type="file" name="photo" accept="image/*" class="form-control premium-input mb-2" id="photo-input">
            <div class="preview-box">
              {% if student.photo %}
                <img id="photo-preview" src="{{ student.photo.url }}" style="max-height: 100px; object-fit: contain;">
              {% else %}
                <span id="photo-placeholder" class="text-muted small">No photo selected</span>
                <img id="photo-preview" style="max-height: 100px; object-fit: contain; display: none;">
              {% endif %}
            </div>
          </div>

          <!-- Signature Upload -->
          <div class="col-md-6">
            <label class="form-label">Signature</label>
            <input type="file" name="signature" accept="image/*" class="form-control premium-input mb-2" id="sig-input">
            <div class="preview-box">
              {% if student.signature %}
                <img id="sig-preview" src="{{ student.signature.url }}" style="max-height: 100px; object-fit: contain;">
              {% else %}
                <span id="sig-placeholder" class="text-muted small">No signature selected</span>
                <img id="sig-preview" style="max-height: 100px; object-fit: contain; display: none;">
              {% endif %}
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="col-12 d-flex gap-3 justify-content-end mt-4">
            <a href="{% url 'dashboard' %}" class="btn btn-premium-secondary">Cancel</a>
            <button type="submit" class="btn btn-premium">{{ action }} Student</button>
          </div>

        </div>
      </form>
    </div>
  </div>

  <script>
    // Aadhaar Input Formatter (xxxx xxxx xxxx)
    function formatAadhaar(el) {
      let v = el.value.replace(/\D/g, '').slice(0, 12);
      el.value = v.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
    }

    // Photo Preview handler
    document.getElementById('photo-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const preview = document.getElementById('photo-preview');
          const placeholder = document.getElementById('photo-placeholder');
          if (placeholder) placeholder.style.display = 'none';
          preview.src = evt.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    });

    // Signature Preview handler
    document.getElementById('sig-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const preview = document.getElementById('sig-preview');
          const placeholder = document.getElementById('sig-placeholder');
          if (placeholder) placeholder.style.display = 'none';
          preview.src = evt.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
